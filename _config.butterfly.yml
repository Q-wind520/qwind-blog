# --------------------------------------
# Hexo Butterfly 主题配置
# 如有任何问题，请参考文档
# 中文文档: https://butterfly.js.org/
# 英文文档: https://butterfly.js.org/en/
# --------------------------------------

# --------------------------------------
# Navigation Settings 导航
# --------------------------------------

nav:
  # 导航栏 Logo 图片
  logo:
  display_title: true
  display_post_title: true
  # 是否固定导航栏
  fixed: false

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  友链: /link/ || fas fa-link
  关于: /about/ || fas fa-heart

# --------------------------------------
# Code Blocks Settings 代码块
# --------------------------------------

code_blocks:
  # 代码块主题: darker / pale night / light / ocean / false
  theme: darker
  macStyle: true
  # 代码块高度限制（单位: px）
  height_limit: false
  word_wrap: false

  # 工具栏
  copy: true
  language: true
  # true: 收缩代码块 | false: 展开代码块 | none: 展开代码块并隐藏按钮
  shrink: false
  fullpage: false

# 社交媒体链接
# 格式:
#   icon: 链接 || 描述 || 颜色
social:
  # fab fa-github: https://github.com/xxxxx || Github || '#24292e'
  # fas fa-envelope: mailto:xxxxxx@gmail.com || Email || '#4a7dbe'

# --------------------------------------
# Image Settings 图像
# --------------------------------------

favicon: /img/qwind.png

avatar:
  img: /img/qwind.jpg
  effect: false

# 禁用所有横幅图片
disable_top_img: false

# 如果页面未设置横幅，将显示默认顶部图片
default_top_img:

# 首页的横幅图片
index_img: /img/BA.png

# 归档页的横幅图片
archive_img: /img/BA.png

# 注意：单个标签页面，不是标签总览页
tag_img: /img/BA.png

# 标签页的横幅图片，可为每个标签单独设置横幅图片
# 格式:
#  - 标签名: xxxxx
tag_per_img:

# 注意：单个分类页面，不是分类总览页
category_img: /img/BA.png

# 分类页的横幅图片，可为每个分类单独设置横幅图片
# 格式:
#  - 分类名: xxxxx
category_per_img:

# 页脚的背景图片
footer_img: false

# 网站背景
# 可设置为颜色、图片URL或包含颜色和/或图片URL的数组
# 如果设置为数组，每次加载时会从数组中随机选择一个背景
background: [
  /img/alona_nav.png
]

cover:
  # 是否启用封面
  index_enable: true
  aside_enable: true
  archives_enable: true
  # 当未设置封面时，显示默认封面
  default_cover: 
    - /img/1.png

# 替换损坏的图片
error_img:
  flink: /img/friend_404.gif
  post_page: /img/404.jpg

# 简单的404页面
error_404:
  enable: true
  subtitle: 'Page Not Found'
  background: /img/error-page.png

post_meta:
  # 首页
  page:
    # 选择: created（创建日期）/ updated（更新日期）/ both（两者）
    date_type: created
    # 选择: date（日期）/ relative（相对时间）
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    # 选择: left（左对齐）/ center（居中）
    position: left
    # 选择: created（创建日期）/ updated（更新日期）/ both（两者）
    date_type: both
    # 选择: date（日期）/ relative（相对时间）
    date_format: date
    categories: true
    tags: true
    label: true

# --------------------------------------
# Index page settings 主页设置
# --------------------------------------

# 首页顶部图片设置
# 默认: 顶部图片全屏，站点信息居中
# 站点信息的位置，例如: 300px/300em/300rem/10%
index_site_info_top:
# 顶部图片的高度，例如: 300px/300em/300rem
index_top_img_height:

# 首页副标题
subtitle:
  enable: true
  # 打字机效果
  effect: true
  # 自定义 typed.js
  # https://github.com/mattboldt/typed.js/#customization
  typed_option:
  # 来源 - 调用第三方服务 API（仅中文）
  # 将先显示来源，再显示 sub 的内容
  # 选择: false/1/2/3
  # false - 禁用该功能
  # 1 - hitokoto.cn
  # 2 - https://api.aa1.cn/doc/yiyan.html
  # 3 - jinrishici.com
  source: false
  # 如果关闭打字机效果，副标题将只显示 sub 的第一行
  sub: 欢迎访问温水wind的空间 | 愿温柔与你同在

# 首页文章布局
# 1: 封面在左，信息在右
# 2: 封面在右，信息在左
# 3: 封面和信息左右交替
# 4: 封面在上，信息在下
# 5: 信息显示在封面上
# 6: 瀑布流布局 - 封面在上，信息在下
# 7: 瀑布流布局 - 信息显示在封面上
index_layout: 3

# 在首页显示文章简介
# 1: 描述
# 2: 两者（如果描述存在则显示描述，否则显示自动摘要）
# 3: 自动摘要（默认）
# false: 不显示文章简介
index_post_content:
  method: 2
  # 如果设置 method 为 2 或 3，需要配置长度
  length: 500

# --------------------------------------
# Post Settings 文章页面
# --------------------------------------

toc:
  post: true
  page: false
  number: true
  expand: true
  # 仅用于文章页面
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href: https://space.bilibili.com/1448050897
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# 赞助/打赏
reward:
  enable: false
  text:
  QR_code:
    # - img: /img/wechat.jpg
    #   link:
    #   text: 微信
    # - img: /img/alipay.jpg
    #   link:
    #   text: 支付宝

# 文章编辑
# 在线浏览和编辑博客源代码
post_edit:
  enable: false
  # url: https://github.com/用户名/仓库名/edit/分支名/子目录名/
  # 例如: https://github.com/jerryc127/butterfly.js.org/edit/main/source/
  url:

# 相关文章
related_post:
  enable: true
  # 显示的文章数量
  limit: 6
  # 选择: created（创建日期）/ updated（更新日期）
  date_type: created

# 选择: 1 / 2 / false
# 1: "下一篇"链接到旧文章
# 2: "下一篇"链接到新文章
# false: 禁用分页
post_pagination: 2

# 显示文章过期提示
noticeOutdate:
  enable: true
  # 样式: simple（简单）/ flat（扁平）
  style: simple
  # 何时显示
  limit_day: 365
  # 位置: top（顶部）/ bottom（底部）
  position: top
  message_prev: 内容可能过期
  message_next: 文章已经超过365天没有更新了，内容可能过期。

# --------------------------------------
# Footer Settings 页脚设置
# --------------------------------------
footer:
  nav:
  owner:
    enable: true
    since: 2025
  # 主题和框架的版权信息
  copyright:
    enable: true
    version: false
  custom_text:

# --------------------------------------
# Aside Settings 侧边栏设置
# --------------------------------------

aside:
  enable: true
  hide: false
  # 在右下角按钮中显示隐藏侧边栏的按钮
  button: true
  mobile: true
  # 位置: left（左侧）/ right（右侧）
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description:
    button:
      enable: true
      icon: fab fa-github
      text: 关注我
      link: https://github.com/Q-wind520
  card_announcement:
    enable: true
    content: 这是我的博客
  card_recent_post:
    enable: true
    # 如果设置为 0 则显示全部
    limit: 5
    # 排序: date（日期）/ updated（更新日期）
    sort: date
    sort_order:
  card_newest_comments:
    enable: false
    sort_order:
    limit: 6
    # 单位: 分钟，将数据保存到 localStorage
    storage: 10
    avatar: true
  card_categories:
    enable: true
    # 如果设置为 0 则显示全部
    limit: 8
    # 选择: none（无）/ true（展开）/ false（折叠）
    expand: none
    sort_order:
  card_tags:
    enable: true
    # 如果设置为 0 则显示全部
    limit: 40
    color: false
    custom_colors:
    # 标签排序方式: random（随机）/ name（名称）/ length（长度）
    orderby: random
    # 排序顺序: 1 为升序, -1 为降序
    order: 1
    sort_order:
  card_archives:
    enable: true
    # 类型: monthly（按月）/ yearly（按年）
    type: monthly
    # 例如: YYYY年MM月
    format: MMMM YYYY
    # 排序顺序: 1 为升序, -1 为降序
    order: -1
    # 如果设置为 0 则显示全部
    limit: 8
    sort_order:
  card_post_series:
    enable: true
    # 标题显示系列名称
    series_title: false
    # 按标题或日期排序
    orderBy: 'date'
    # 排序顺序: 1 为升序, -1 为降序
    order: -1
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    sort_order:
    # 发布至今的时间差
    # 格式: 月/日/年 时间 或 年/月/日 时间
    # 如果不启用此功能请留空
    runtime_date:

# --------------------------------------
# Bottom right button 右下角按钮
# --------------------------------------

# 右下角按钮距离底部的距离（默认单位: px）
rightside_bottom:

# 简繁转换
translate:
  enable: false
  # 按钮文字
  default: 繁
  # 网站语言（1 - 繁体中文 / 2 - 简体中文）
  defaultEncoding: 2
  # 时间延迟
  translateDelay: 0
  # 当语言为简体中文时按钮的文字
  msgToTraditionalChinese: '繁'
  # 当语言为繁体中文时按钮的文字
  msgToSimplifiedChinese: '簡'

# 阅读模式
readmode: true

# 暗色模式
darkmode:
  enable: true
  # 切换暗色/亮色模式的按钮
  button: true
  # 自动切换暗色/亮色模式
  # autoChangeMode: 1  跟随系统设置，如果系统不支持暗色模式，则在下午6点到上午6点之间切换暗色模式
  # autoChangeMode: 2  在下午6点到上午6点之间切换暗色模式
  # autoChangeMode: false
  autoChangeMode: false
  # 设置亮色模式时间。值为 0 到 24 之间。如果未设置，默认值为 6 和 18
  start:
  end:

# 在回到顶部按钮中显示滚动百分比
rightside_scroll_percent: false

# 除非你了解其工作原理，否则不要修改以下设置
# 选择: readmode,translate,darkmode,hideAside,toc,chat,comment
# 不要重复相同的值
rightside_item_order:
  enable: false
  # 默认: readmode,translate,darkmode,hideAside
  hide:
  # 默认: toc,chat,comment
  show:

# 右下角配置按钮的动画
rightside_config_animation: true

# --------------------------------------
# Global Settings 全局设置
# --------------------------------------

anchor:
  # 滚动时，URL 将根据标题 id 更新
  auto_update: false
  # 点击标题滚动并更新锚点
  click_to_scroll: false

photofigcaption: false

copy:
  enable: true
  # 在复制内容后添加版权信息
  copyright:
    enable: false
    limit_count: 150

# 需要安装 hexo-wordcount 插件
wordcount:
  enable: false
  # 在文章元数据中显示文章字数
  post_wordcount: true
  # 在文章元数据中显示阅读时间
  min2read: true
  # 在侧边栏的网站信息中显示网站总字数
  total_wordcount: true

# 不蒜子网站 PV / UV 统计
Busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

# --------------------------------------
# Math 数学公式
# --------------------------------------

# 关于 per_page
# 如果设置为 true，将在每个页面加载 mathjax/katex 脚本
# 如果设置为 false，将根据你的设置加载 mathjax/katex 脚本（在页面的 front-matter 中添加 'mathjax: true' 或 'katex: true'）
math:
  # 选择: mathjax, katex
  # 如果不需要数学公式请留空
  use:
  per_page: true
  hide_scrollbar: false

  mathjax:
    # 启用右键菜单
    enableMenu: true
    # 选择: all / ams / none，控制公式是否编号以及如何编号
    tags: none

  katex:
    # 启用复制 KaTeX 公式
    copy_tex: false

# --------------------------------------
# Search 搜索
# --------------------------------------

search:
  # 选择: algolia_search / local_search / docsearch
  # 如果不需要搜索请留空
  use:
  placeholder:

  # Algolia 搜索
  algolia_search:
    # 每页搜索结果数量
    hitsPerPage: 6

  # 本地搜索
  local_search:
    # 页面加载时预加载搜索数据
    preload: false
    # 每篇文章显示前 n 条结果，设置为 -1 显示全部
    top_n_per_article: 1
    # 将 HTML 字符串转义为可读文本
    unescape: false
    # 启用搜索结果分页
    pagination:
      enable: false
      # 每页搜索结果数量
      hitsPerPage: 8
    CDN:

  # Docsearch 搜索
  # https://docsearch.algolia.com/
  docsearch:
    appId:
    apiKey:
    indexName:
    option:

# --------------------------------------
# Share System 分享系统
# --------------------------------------

share:
  # 选择: sharejs / addtoany
  # 如果不需要分享请留空
  use: sharejs

  # Share.js
  # https://github.com/overtrue/share.js
  sharejs:
    sites: facebook,x,wechat,weibo,qq

  # AddToAny
  # https://www.addtoany.com/
  addtoany:
    item: facebook,x,wechat,sina_weibo,facebook_messenger,email,copy_link

# --------------------------------------
# Comments System 评论系统
# --------------------------------------

comments:
  # 最多两个评论系统，第一个将显示为默认
  # 如果不需要评论请留空
  # 选择: Disqus/Disqusjs/Livere/Gitalk/Valine/Waline/Utterances/Facebook Comments/Twikoo/Giscus/Remark42/Artalk
  # 两个评论系统的格式: Disqus,Waline
  use:
  # 在按钮旁边显示评论名称
  text: true
  # 懒加载：当评论元素进入浏览器视口时才会加载评论系统
  # 如果设置为 true，评论计数将无效
  lazyload: false
  # 在文章顶部图片中显示评论数
  count: false
  # 在首页显示评论数
  card_post_count: false

# Disqus
# https://disqus.com/
disqus:
  shortname:
  # 用于最新评论小部件
  apikey:

# 替代 Disqus - 使用 Disqus API 渲染评论
# https://github.com/SukkaW/DisqusJS
disqusjs:
  shortname:
  apikey:
  option:

# Livere（来必力）
# https://www.livere.com/
livere:
  uid:

# Gitalk
# https://github.com/gitalk/gitalk
gitalk:
  client_id:
  client_secret:
  repo:
  owner:
  admin:
  option:

# Valine
# https://valine.js.org
valine:
  appId:
  appKey:
  avatar: monsterid
  # 此配置适用于国内自定义域名用户，海外版本将自动检测（无需手动填写）
  serverURLs:
  bg:
  # 使用 Valine 访客计数作为页面浏览量
  visitor: false
  option:

# Waline - 一款带后端的简洁评论系统，从 Valine 衍生而来
# https://waline.js.org/
waline:
  serverURL:
  bg:
  # 使用 Waline 页面浏览量作为页面浏览量
  pageview: false
  option:

# Utterances
# https://utteranc.es/
utterances:
  repo:
  # Issue 映射: pathname/url/title/og:title
  issue_term: pathname
  # 主题: github-light/github-dark/github-dark-orange/icy-dark/dark-blue/photon-dark
  light_theme: github-light
  dark_theme: photon-dark
  js:
  option:

# Facebook 评论插件
# https://developers.facebook.com/docs/plugins/comments/
facebook_comments:
  app_id:
  # 可选
  user_id:
  pageSize: 10
  # 选择: social（社交）/ time（时间）/ reverse_time（时间倒序）
  order_by: social
  lang: en_US

# Twikoo
# https://github.com/imaegoo/twikoo
twikoo:
  envId:
  region:
  # 使用 Twikoo 访客计数作为页面浏览量
  visitor: false
  option:

# Giscus
# https://giscus.app/
giscus:
  repo:
  repo_id:
  category_id:
  light_theme: light
  dark_theme: dark
  js:
  option:

# Remark42
# https://remark42.com/docs/configuration/frontend/
remark42:
  host:
  siteId:
  option:

# Artalk
# https://artalk.js.org/guide/frontend/config.html
artalk:
  server:
  site:
  # 使用 Artalk 访客计数作为页面浏览量
  visitor: false
  option:

# --------------------------------------
# Chat Services 聊天服务
# --------------------------------------

chat:
  # 选择: chatra/tidio/crisp
  # 如果不需要聊天请留空
  use:
  # 聊天按钮 [推荐]
  # 将在网站右下角创建一个按钮，并隐藏原始按钮
  rightside_button: false
  # 向上滚动时显示原始聊天按钮，向下滚动时隐藏
  button_hide_show: false

# https://chatra.io/
chatra:
  id:

# https://www.tidio.com/
tidio:
  public_key:

# https://crisp.chat/en/
crisp:
  website_id:

# --------------------------------------
# Analysis 统计
# --------------------------------------

# https://tongji.baidu.com/web/welcome/login
baidu_analytics:

# https://analytics.google.com/analytics/web/
google_analytics:

# https://www.cloudflare.com/zh-tw/web-analytics/
cloudflare_analytics:

# https://clarity.microsoft.com/
microsoft_clarity:

# https://umami.is/
umami_analytics:
  enable: false
  # 对于自托管，配置 Umami 实例的主机名
  serverURL:
  script_name: script.js
  website_id:
  option:
  UV_PV:
    site_uv: false
    site_pv: false
    page_pv: false
    # Umami Cloud（API 密钥）/ 自托管 Umami（令牌）
    token:


# https://www.googletagmanager.com/
google_tag_manager:
  tag_id:
  # 可选
  domain:

# --------------------------------------
# Advertisement 广告
# --------------------------------------

# Google Adsense
google_adsense:
  enable: false
  auto_ads: true
  js: https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js
  client:
  enable_page_level_ads: true

# 手动插入广告
# 如果不需要广告请留空
ad:
  # 在首页插入广告（每三篇文章）
  index:
  # 在侧边栏插入广告
  aside:
  # 在文章中插入广告（分页前）
  post:

# --------------------------------------
# Verification 站点验证
# --------------------------------------

site_verification:
  # - name: google-site-verification
  #   content: xxxxxx
  # - name: baidu-site-verification
  #   content: xxxxxxx

# --------------------------------------
# Beautify / Effect 美化/效果
# --------------------------------------

# 自定义主题颜色
# 注意：颜色值必须用双引号括起来，如 "#000"，否则可能导致错误！

theme_color:
  enable: true
  main: "#49B1F5"
  paginator: "#00c4b6"
  button_hover: "#FF7242"
  text_selection: "#00c4b6"
  link_color: "#99a9bf"
  meta_color: "#858585"
  hr_color: "#A4D8FA"
  code_foreground: "#F47466"
  code_background: "rgba(27, 31, 35, .05)"
  toc_color: "#00c4b6"
  blockquote_padding_color: "#49b1f5"
  blockquote_background_color: "#49b1f5"
  scrollbar_color: "#49b1f5"
  meta_theme_color_light: "ffffff"
  meta_theme_color_dark: "#0d0d0d"

# 分类和标签页面的用户界面设置
# 选择: index - 与首页 UI 相同 / default - 与归档页 UI 相同
# 留空或设置为 index
category_ui:
tag_ui:

# UI 元素的圆角
rounded_corners_ui: true

# 拉伸行以使每行具有相等的宽度
text_align_justify: false

# 为页眉和页脚添加遮罩
mask:
  header: true
  footer: true

# 加载动画
preloader:
  enable: true
  # 来源
  # 1. fullpage-loading（全屏加载）
  # 2. pace（进度条）
  source: 1
  # pace 主题（参见 https://codebyzach.github.io/pace/）
  pace_css_url:

# 页面过渡动画
enter_transitions: true

# 默认显示模式 - light（亮色，默认）/ dark（暗色）
display_mode: dark

# 文章内容美化配置
beautify:
  enable: true
  # 指定美化的范围（site 或 post）
  field: post
  # 指定用作标题前缀的图标，如 '\f0c1'
  title_prefix_icon: 
  # 指定标题前缀图标的颜色，如 '#F47466'
  title_prefix_icon_color:

# 全局字体设置
# 除非你了解其工作原理，否则不要修改以下设置
font:
  global_font_size:
  code_font_size:
  font_family:
  code_font_family:

# 站点标题和副标题的字体设置
blog_title_font:
  font_link:
  font_family:

# 分隔线图标设置
hr_icon:
  enable: true
  # Font Awesome 图标的 unicode 值，如 '\3423'
  icon:
  icon_top:

# 打字机效果
# https://github.com/disjukr/activate-power-mode
activate_power_mode:
  enable: true
  colorful: true
  shake: false
  mobile: true

# 背景效果
# --------------------------------------

# canvas_ribbon（彩带效果）
# 参见: https://github.com/hustcc/ribbon.js
canvas_ribbon:
  enable: false
  # 彩带的大小
  size: 150
  # 彩带的透明度（0 ~ 1）
  alpha: 0.6
  zIndex: -1
  click_to_change: false
  mobile: false

# 飘动彩带
canvas_fluttering_ribbon:
  enable: false
  mobile: false

# canvas_nest（网状背景）
# https://github.com/hustcc/canvas-nest.js
canvas_nest:
  enable: false
  # 线条颜色，默认: '0,0,0'；RGB 值: (R,G,B)。（注意：使用 ',' 分隔）
  color: '0,0,255'
  # 线条透明度（0~1）
  opacity: 0.7
  # 背景的 z-index 属性
  zIndex: -1
  # 线条数量
  count: 99
  mobile: false

# 鼠标点击效果：烟花
fireworks:
  enable: false
  zIndex: 9999
  mobile: false

# 鼠标点击效果：爱心
click_heart:
  enable: false
  mobile: false

# 鼠标点击效果：文字
clickShowText:
  enable: true
  text:
    - ciallo~
    - (∠・ω< )⌒★
    - 邦邦咔邦~
    - 诶嘿
    - ᕕ(◠ڼ◠)ᕗ
  fontSize: 12px
  random: true
  mobile: true


# --------------------------------------
# Lightbox Settings 灯箱设置
# --------------------------------------

# 选择: fancybox / medium_zoom
# https://github.com/francoischalifour/medium-zoom
# https://fancyapps.com/fancybox/
# 如果不需要灯箱请留空
lightbox:

# --------------------------------------
# Tag Plugins settings 标签插件设置
# --------------------------------------

# 系列文章
series:
  enable: false
  # 按标题或日期排序
  orderBy: 'title'
  # 排序顺序: 1 为升序, -1 为降序
  order: 1
  number: true

# ABCJS - ABC 音乐记谱法插件
# https://github.com/paulrosen/abcjs
abcjs:
  enable: false
  per_page: true

# Mermaid 图表
# https://github.com/mermaid-js/mermaid
mermaid:
  enable: false
  # 使用代码块编写 Mermaid 图表
  code_write: false
  # 内置主题: default / forest / dark / neutral
  theme:
    light: default
    dark: dark
  # 启用"在新标签页中打开"按钮，在单独窗口中查看图表
  open_in_new_tab: true
  # 启用图表的缩放和平移交互
  zoom_pan: true

# chartjs 图表
# 参见 https://www.chartjs.org/docs/latest/
chartjs:
  enable: false
  # 除非你了解其工作原理，否则不要修改。
  # 默认设置仅在未指定 MD 语法时使用。
  # 图表的通用字体颜色
  fontColor:
    light: 'rgba(0, 0, 0, 0.8)'
    dark: 'rgba(255, 255, 255, 0.8)'
  # 图表的通用边框颜色
  borderColor:
    light: 'rgba(0, 0, 0, 0.1)'
    dark: 'rgba(255, 255, 255, 0.2)'
  # 雷达图和极地区域图刻度标签的背景颜色
  scale_ticks_backdropColor:
    light: 'transparent'
    dark: 'transparent'

# Note - Bootstrap 标注
note:
  # Note 标签样式值:
  #  - simple    bs-callout 旧版警告样式。默认。
  #  - modern    bs-callout 新版（v2-v3）警告样式。
  #  - flat      扁平标注样式带背景，类似 Mozilla 或 StackOverflow。
  #  - disabled  禁用 note 标签的所有 CSS 样式导入。
  style: flat
  icons: true
  border_radius: 3
  # modern 和 flat 样式的背景亮度偏移百分比（modern: -12 | 12; flat: -18 | 6）。
  # 偏移也适用于标签变量。此选项可与禁用的 note 标签一起使用。
  light_bg_offset: 0

# --------------------------------------
# Other Settings 其他设置
# --------------------------------------

# https://github.com/MoOx/pjax
pjax:
  enable: false
  # 排除指定页面不使用 pjax，如 '/music/'
  exclude:
    # - /xxxxxx/

# 注入 CSS 和脚本（aplayer/meting）
aplayerInject:
  enable: false
  per_page: true

# Snackbar - 吐司通知
# https://github.com/polonel/SnackBar
# 位置: top-left（左上）/ top-center（中上）/ top-right（右上）/ bottom-left（左下）/ bottom-center（中下）/ bottom-right（右下）
snackbar:
  enable: false
  position: bottom-left
  # 亮色模式和暗色模式下吐司通知的背景颜色
  bg_light: '#49b1f5'
  bg_dark: '#1f1f1f'

# Instant.page
# https://instant.page/
instantpage: false

# 懒加载
# https://github.com/verlok/vanilla-lazyload
lazyload:
  enable: false
  # 使用浏览器原生懒加载替代 vanilla-lazyload
  native: false
  # 指定使用懒加载的范围（site 或 post）
  field: site
  placeholder:
  blur: false

# PWA 渐进式 Web 应用
# 参见 https://github.com/JLHwung/hexo-offline
# ---------------
pwa:
  enable: false
  manifest:
  apple_touch_icon:
  favicon_32_32:
  favicon_16_16:
  mask_icon:

# Open Graph 元标签
# https://hexo.io/docs/helpers#open-graph
Open_Graph_meta:
  enable: true
  option:
    # twitter_card:
    # twitter_image:
    # twitter_id:
    # twitter_site:
    # google_plus:
    # fb_admins:
    # fb_app_id:

# 结构化数据
# https://developers.google.com/search/docs/guides/intro-structured-data
structured_data:
  enable: false
  # 站点的备用名称，用于结构化数据
  # 格式: ['名称1', '名称2']
  alternate_name:

# 添加供应商前缀以确保兼容性
css_prefix: true

# 注入
# 将代码插入到 head（'</head>' 标签之前）和底部（'</body>' 标签之前）
inject:
  head:
    # - <link rel="stylesheet" href="/xxx.css">
  bottom:
    # - <script src="xxxx"></script>

# CDN 设置
# 除非你了解其工作原理，否则不要修改以下设置
CDN:
  # 内部和第三方脚本的 CDN 提供商
  # 两者选项: local/jsdelivr/unpkg/cdnjs/custom
  # 注意：开发版本只能使用 'local' 作为内部脚本
  # 注意：将第三方脚本设置为 'local' 时，需要安装 hexo-butterfly-extjs
  internal_provider: local
  third_party_provider: jsdelivr

  # 为 URL 添加版本号，true 或 false
  version: true

  # 自定义格式
  # 例如: https://cdn.staticfile.org/${cdnjs_name}/${version}/${min_cdnjs_file}
  custom_format:

  option:
